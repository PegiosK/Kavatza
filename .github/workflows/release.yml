name: Release APK

# Builds a SIGNED release APK and publishes it as a GitHub Release
# (a permanent public download link you can post anywhere).
#
# Trigger it either way:
#   • push a tag:   git tag v1.0 && git push origin v1.0
#   • or: Actions tab → Release APK → Run workflow → type a version (e.g. v1.0)
#
# Requires four repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, e.g. v1.0'
        required: true
        default: 'v1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: echo "tag=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/kavatza-release.keystore

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PATH: kavatza-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "kavatza-${{ steps.ver.outputs.tag }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "καβάτζα ${{ steps.ver.outputs.tag }}"
          files: kavatza-*.apk
          body: |
            **καβάτζα** — προσωπικός προϋπολογισμός σε φακέλους (offline, χωρίς τράπεζες).

            ### Εγκατάσταση
            1. Κατέβασε το αρχείο **kavatza-*.apk** πιο κάτω στο κινητό σου.
            2. Άνοιξέ το. Αν το Android ρωτήσει, επίτρεψε την εγκατάσταση εφαρμογών από αυτή την πηγή.
            3. Πάτησε **Εγκατάσταση** — θα εμφανιστεί ως **καβάτζα**.

            Τα δεδομένα μένουν μόνο στη συσκευή σου.
